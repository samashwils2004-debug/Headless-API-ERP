[flake8]
max-line-length = 100
max-complexity = 10
exclude =
    .git,
    __pycache__,
    alembic/versions,
    .venv,
    venv

[tool:pytest]
testpaths = tests
asyncio_mode = auto

[mypy]
python_version = 3.12
ignore_missing_imports = True
strict = False
warn_return_any = True
warn_unused_ignores = True
